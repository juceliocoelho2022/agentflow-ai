services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow_dev
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agentflow
      SPRING_DATASOURCE_USERNAME: agentflow
      SPRING_DATASOURCE_PASSWORD: agentflow_dev
    ports:
      - "8088:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "3008:80"
    depends_on:
      - backend
volumes:
  postgres_data:
