spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/agentflow}
    username: ${SPRING_DATASOURCE_USERNAME:agentflow}
    password: ${SPRING_DATASOURCE_PASSWORD:agentflow_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
